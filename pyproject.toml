[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ig-threads-streaming-telebot"
version = "0.1.2"
description = "Telegram bot webhook that ingests Instagram & Threads links and stores them in Google Sheets, deployed on AWS Lambda"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gspread>=6.0.0",
    "google-auth>=2.28.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
]
lambda = [
    "aws-lambda-powertools>=2.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ig_threads_telebot"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
